# NSE & BSE Trading Calendar & Expiry Rule Master
# Accounts for exchange circular updates and holiday shifts

market_sessions:
  normal:
    pre_open_start: "09:00:00"
    pre_open_end: "09:08:00"
    market_open: "09:15:00"
    market_close: "15:30:00"
    post_close_start: "15:40:00"
    post_close_end: "16:00:00"
  muhurat:
    duration_minutes: 60

expiry_cycles:
  NIFTY:
    cycle: "weekly"
    primary_day_of_week: 3  # 0=Mon, 1=Tue, 2=Wed, 3=Thu, 4=Fri
    holiday_rule: "preceding_trading_day"
  BANKNIFTY:
    cycle: "weekly"
    primary_day_of_week: 2  # Wednesday weekly cycle
    holiday_rule: "preceding_trading_day"
  FINNIFTY:
    cycle: "weekly"
    primary_day_of_week: 1  # Tuesday
    holiday_rule: "preceding_trading_day"
  SENSEX:
    cycle: "weekly"
    primary_day_of_week: 4  # Friday
    holiday_rule: "preceding_trading_day"

